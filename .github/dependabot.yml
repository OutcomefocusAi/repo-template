# Dependabot version updates. Pull requests use the `ci` Conventional Commits prefix
# and are exempt from the issue-reference rule, but still go through Principal QA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

