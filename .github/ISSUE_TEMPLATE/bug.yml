name: Bug
description: Something does not work as specified.
title: "fix: <summary>"
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen, ideally quoting the spec requirement or scenario.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and steps to reproduce
    validations:
      required: true
  - type: input
    id: notion-row
    attributes:
      label: Notion Tasks row
      placeholder: https://www.notion.so/<workspace>/<task-row>
  - type: markdown
    attributes:
      value: Do not report security problems here; see SECURITY.md.
