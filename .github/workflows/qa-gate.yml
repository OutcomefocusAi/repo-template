# qa-gate: sets commit status `qa-gate` on the pull request head.
#
# Passes only when the newest verdict, by creation time, from an allowlisted account is a
# comment or non-dismissed review whose first line is exactly
#   Independent QA by <reviewer>: SHIP
# and whose body contains the full current head SHA. SHIP-WITH-FIXES (AGENTS.md spelling),
# SHIP WITH FIXES and NO-SHIP fail. Fail closed: any later allowlisted comment or review
# whose first line contains "Independent QA by" but is not a valid verdict for the head
# (other spelling, extra text or spaces, short or other SHA) blocks an earlier SHIP.
#
# Limits (README, "How main is protected"): every agent posts as AgileKnow23, so the gate
# cannot tell Principal QA from another agent; and a pull_request run uses the pull
# request's copy of this file. The gate guards against mistakes and outsiders, not against
# the shared identity.
#
# Never checks out pull request code. issue_comment and pull_request_review runs re-evaluate
# when a verdict is added, edited, deleted, or dismissed.
name: qa-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

# Newest run wins: each run reads the current head and all verdicts, so a superseded run
# has nothing left to decide.
concurrency:
  group: qa-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read        # default read access
      pull-requests: read   # read the pull request, its files, comments and reviews
      statuses: write       # set the qa-gate commit status on the head SHA
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Accounts whose verdict comments count. On a public repository anyone can comment.
      ALLOWLIST: "AgileKnow23"
    steps:
      - name: Evaluate QA verdict for the head commit
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          head_sha=$(jq -r .head.sha <<<"$pr_json")

          set_status() {
            gh api -X POST "repos/$REPO/statuses/$head_sha" \
              -f state="$1" -f context=qa-gate -f description="$2" >/dev/null
            echo "qa-gate: $1: $2"
          }

          # Release pull requests pass without a verdict only when release-please opened them
          # from this repository and they touch release files alone.
          release_ok=$(jq -r --arg repo "$REPO" '(.head.ref | startswith("release-please--")) and .head.repo.full_name == $repo and .user.login == "github-actions[bot]"' <<<"$pr_json")
          if [[ "$release_ok" == "true" ]]; then
            others=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
              | grep -v -x -e CHANGELOG.md -e version.txt -e .release-please-manifest.json || true)
            if [[ -z "$others" ]]; then
              set_status success "Release pull request touching only release files"
              exit 0
            fi
          fi

          allow_json=$(jq -R -c 'split(" ") | map(select(length > 0))' <<<"$ALLOWLIST")
          verdict=$( { gh api --paginate "repos/$REPO/issues/$PR/comments" \
                         --jq '.[] | {user: {login: .user.login}, body, created_at, updated_at}'
                       gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
                         --jq '.[] | {user: {login: .user.login}, body: (.body // ""), created_at: .submitted_at, updated_at: .submitted_at, state}'; } \
            | jq -r -s --arg sha "$head_sha" --argjson allow "$allow_json" '
                map(select((.state // "") != "DISMISSED"))
                | map(select(.user.login as $u | $allow | index($u)))
                | map(. + {first: ((.body // "") | split("\n")[0] | rtrimstr("\r")), at: (.created_at // .updated_at)})
                | map(select(.first | ascii_downcase | contains("independent qa by")))
                | map(. + {valid: ((.first | test("^Independent QA by .+: (SHIP|SHIP[ -]WITH[ -]FIXES|NO-SHIP)$")) and (.body | contains($sha)))})
                | sort_by(.at)
                | (map(select(.valid)) | last) as $v
                | if $v == null then ""
                  elif any(.[]; (.valid | not) and .at > $v.at) then "NO-SHIP"
                  else ($v.first | capture(": (?<v>SHIP|SHIP[ -]WITH[ -]FIXES|NO-SHIP)$").v) end')

          case "$verdict" in
            "SHIP") set_status success "Independent QA shipped ${head_sha:0:7}" ;;
            "") set_status failure "QA has not shipped this head (${head_sha:0:7})" ;;
            *) set_status failure "Latest QA verdict for ${head_sha:0:7} is $verdict or unreadable" ;;
          esac
